{% extends "base.html" %}
{% block content %}
<div class="row g-3">
  <div class="col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header bg-white">Add Branch</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Branch name</label>
            <input class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">City</label>
            <input class="form-control" name="city" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Save branch</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-white">Branches</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>City</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
              {% for branch in branches %}
              <tr>
                <td>{{ branch.id }}</td>
                <td>{{ branch.name }}</td>
                <td>{{ branch.city }}</td>
                <td>{{ branch.created_at.strftime("%Y-%m-%d") }}</td>
              </tr>
              {% else %}
              <tr><td colspan="4" class="text-center text-muted py-3">No branches added yet.</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
